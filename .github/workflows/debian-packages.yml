name: Debian packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflow and packaging scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Validate workflow and scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: |
          "$RUNNER_TEMP/actionlint" -color
          shellcheck scripts/ci/*.sh scripts/build-debian*.sh
          python3 -m compileall -q scripts packaging/debian

  package:
    name: Debian ${{ matrix.suite }} amd64
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_SUITE: ${{ matrix.suite }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      INZONE_BUILD_JOBS: '2'

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize build paths
        run: |
          {
            printf 'PREPARATION_DIRECTORY=%s/debian-inputs\n' "$RUNNER_TEMP"
            printf 'BUILD_DIRECTORY=%s/debian-build\n' "$RUNNER_TEMP"
            printf 'ARTIFACT_DIRECTORY=%s/debian-artifacts\n' "$RUNNER_TEMP"
            printf 'LOG_DIRECTORY=%s/debian-logs\n' "$RUNNER_TEMP"
            printf 'SWIFT_TOOLCHAIN=%s/swift-6.3.3\n' "$RUNNER_TEMP"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/debian-logs" "$RUNNER_TEMP/debian-artifacts"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils build-essential ca-certificates curl dbus dpkg-dev git gnupg \
            ladspa-sdk libarchive-tools libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev \
            libsystemd-dev libwayland-bin libxml2-dev libz3-dev lintian ninja-build patchelf \
            pkg-config python3 unzip xz-utils zip zlib1g-dev \
            libgl1 libegl1 libfontconfig1 libfreetype6 libglib2.0-0t64 \
            libx11-6 libxkbcommon0 libdbus-1-3 libgssapi-krb5-2 libbrotli1 libzstd1
          cmake --version
          wayland-scanner --version

      - name: Install signed Swift toolchain
        run: scripts/ci/install-swift.sh "$SWIFT_TOOLCHAIN" 2>&1 | tee "$LOG_DIRECTORY/swift.log"

      - name: Prepare signed Debian sysroot and verified Qt SDK
        run: |
          scripts/ci/prepare-debian-keyring.sh "$RUNNER_TEMP/debian-archive.gpg" \
            2>&1 | tee "$LOG_DIRECTORY/keyring.log"
          python3 scripts/prepare-debian.py "$PREPARATION_DIRECTORY" \
            --suite "$DEBIAN_SUITE" --keyring "$RUNNER_TEMP/debian-archive.gpg" \
            2>&1 | tee "$LOG_DIRECTORY/prepare.log"

      - name: Test installation and packaged setup
        if: matrix.suite == 'trixie'
        run: |
          make -C native SWIFTC="$SWIFT_TOOLCHAIN/usr/bin/swiftc" \
            2>&1 | tee "$LOG_DIRECTORY/setup-dsp-build.log"
          "$SWIFT_TOOLCHAIN/usr/bin/swift" test --jobs 2 \
            --scratch-path "$RUNNER_TEMP/setup-tests" --disable-automatic-resolution \
            --filter 'InstallationTests|InstallCoordinatorTests|PackagedSetupTests' \
            2>&1 | tee "$LOG_DIRECTORY/setup-tests.log"

      - name: Build Debian package
        run: |
          scripts/build-debian.sh "$DEBIAN_SUITE" \
            "$PREPARATION_DIRECTORY/root" "$PREPARATION_DIRECTORY/qt/sdk" \
            "$SWIFT_TOOLCHAIN" "$BUILD_DIRECTORY" \
            2>&1 | tee "$LOG_DIRECTORY/build.log"

      - name: Verify package and target dependencies
        run: |
          shopt -s nullglob
          packages=("$BUILD_DIRECTORY"/packages/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi
          python3 scripts/ci/verify-package.py "${packages[0]}" \
            --sysroot "$PREPARATION_DIRECTORY/root" \
            --apt-config "$PREPARATION_DIRECTORY/apt/config" \
            --output-directory "$ARTIFACT_DIRECTORY"
          git rev-parse HEAD > "$ARTIFACT_DIRECTORY/source-commit.txt"
          cp "$PREPARATION_DIRECTORY/debian-target.json" "$ARTIFACT_DIRECTORY/"

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inzone-linux-${{ matrix.suite }}-amd64
          path: ${{ env.ARTIFACT_DIRECTORY }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-${{ matrix.suite }}-diagnostics
          path: |
            ${{ runner.temp }}/debian-logs/*.log
            ${{ runner.temp }}/debian-artifacts/*.log
            ${{ runner.temp }}/debian-artifacts/*.json
            ${{ runner.temp }}/debian-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/debian-build/packages/_CPack_Packages/Linux/DEB/*.log
          if-no-files-found: warn
          retention-days: 14
