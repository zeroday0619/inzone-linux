# Sony INZONE H9 II USB: balanced gaming, music and voice configuration.
# USB descriptors advertise S16_LE / 48000 Hz only.
# Rename this file to .conf.disabled and restart wireplumber to revert.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output[.]usb-Sony_INZONE_H9_II-00[.].*" }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        node.latency = "256/48000"
        priority.session = 1400
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input[.]usb-Sony_INZONE_H9_II-00[.].*" }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        node.latency = "256/48000"
      }
    }
  }
]
